{% extends 'base.html' %}
{% block content %}

<style>
    .edit-container {
        max-width: 850px;
        margin: 40px auto;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        padding: 36px;
        border-radius: 24px;
        box-shadow: 0 18px 38px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .edit-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .edit-header i {
        color: #003366;
        font-size: 2.8rem;
        margin-bottom: 14px;
    }

    .edit-header h2 {
        color: #003366;
        margin: 0;
        font-weight: 800;
    }

    .edit-header p {
        color: #64748b;
        margin: 8px 0 0;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #003366;
        font-weight: 700;
        font-size: 0.95rem;
    }

    .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: white;
        color: #1f2937;
        font-family: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
        border-color: #003366;
        box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.12);
        outline: none;
    }

    .current-image {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 10px;
        padding: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
    }

    .current-image img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 10px;
    }

    .btn-save,
    .btn-cancel {
        border: none;
        padding: 14px 22px;
        border-radius: 12px;
        font-family: inherit;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-save {
        background: #003366;
        color: white;
        cursor: pointer;
    }

    .btn-save:hover {
        background: #00264d;
        transform: translateY(-1px);
    }

    .btn-cancel {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
    }

    .btn-cancel:hover {
        background: #e2e8f0;
        color: #334155;
    }

    @media (max-width: 768px) {
        .edit-container {
            margin: 20px 0;
            padding: 24px;
        }

        .form-grid,
        .btn-row {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="edit-container">
    <div class="edit-header">
        <i class="fas fa-edit"></i>
        <h2>تعديل بيانات المشروع</h2>
        <p>تحديث بيانات المشروع: <strong>{{ project.name }}</strong></p>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-grid">
            <div class="form-group">
                <label for="project-name">اسم المشروع</label>
                <input id="project-name" type="text" name="name" class="form-control" value="{{ project.name }}" required>
            </div>

            <div class="form-group">
                <label for="project-category">تصنيف المشروع</label>
                <input id="project-category" type="text" name="category" class="form-control" value="{{ project.category|default_if_none:'' }}">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="project-start-date">تاريخ البدء</label>
                <input id="project-start-date" type="date" name="start_date" class="form-control" value="{{ project.start_date|date:'Y-m-d' }}" required>
            </div>

            <div class="form-group">
                <label for="project-status">حالة المشروع</label>
                <select id="project-status" name="status" class="form-control" required>
                    {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if project.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="project-description">وصف المشروع</label>
            <textarea id="project-description" name="description" class="form-control" rows="5">{{ project.description|default_if_none:'' }}</textarea>
        </div>

        <div class="form-group">
            <label for="project-image">صورة المشروع</label>
            <input id="project-image" type="file" name="project_image" class="form-control" accept="image/*">

            {% if project.image %}
                <div class="current-image">
                    <img src="{{ project.image.url }}" alt="صورة المشروع الحالية">
                    <span>الصورة الحالية محفوظة، واختيار صورة جديدة سيستبدلها.</span>
                </div>
            {% endif %}
        </div>

        <div class="btn-row">
            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i>
                حفظ التغييرات
            </button>
            <a href="{% url 'projects_list' %}" class="btn-cancel">
                <i class="fas fa-arrow-right"></i>
                إلغاء والعودة
            </a>
        </div>
    </form>
</div>

{% endblock %}
